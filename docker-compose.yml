services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hr_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  frontend:
    build:
      context: .
      target: development
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules # This anonymous volume is key: it keeps node_modules inside the container
    environment:
      - NODE_ENV=development
      - BACKEND_URL=http://backend:5000
    tty: true # Keeps the container process stable
    depends_on:
      - backend

  backend:
    build: ./server
    ports:
      - "5000:5000"
    working_dir: /app
    volumes:
      # Bind mount the local server directory to the container
      - ./server:/app
      # Anonymous volume for node_modules to avoid host overrides
      - /app/node_modules
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/hr_db?schema=public
      - GEMINI_API_KEY=${GEMINI_API_KEY:-your_key_here}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
    depends_on:
      - postgres
    # This ensures your schema is pushed and seeded to the DB before the app starts
    command: sh -c "npx prisma db push && npx prisma db seed && npm run dev"

volumes:
  postgres_data: